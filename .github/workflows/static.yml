name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # This needs to point to the lockfile inside the 'lit' folder
          cache-dependency-path: ./lit/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./lit

      - name: Build
        run: npm run build
        working-directory: ./lit

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # This points to where your build files are
          path: ./lit/dist/

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
